<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F8FAFC">
    <title>Private Chat | Takora</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3ZVP8Q457D"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-3ZVP8Q457D');
    </script>

    <style>
        :root {
            --tk-bg: #F8FAFC;
            --tk-card-bg: #FFFFFF;
            --tk-blue: #2563EB;
            --tk-blue-dark: #1D4ED8;
            --tk-blue-soft: #EFF6FF;
            --tk-border: #E2E8F0;
            --tk-border-blue: #DBEAFE;
            --tk-text: #0F172A;
            --tk-text-muted: #64748B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tk-bg);
            color: var(--tk-text);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        button, input {
            font: inherit;
        }

        .chat-app-shell {
            max-width: 640px;
            width: 100%;
            margin: 0 auto;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            background: var(--tk-card-bg);
            border-left: 1px solid var(--tk-border);
            border-right: 1px solid var(--tk-border);
            position: relative;
        }

        @media (max-width: 640px) {
            .chat-app-shell {
                border-left: none;
                border-right: none;
            }
        }

        .chat-header {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            padding-top: max(10px, env(safe-area-inset-top));
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--tk-border);
            gap: 10px;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            flex: 1;
        }

        .ios-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            padding: 6px 6px 6px 0;
            color: var(--tk-blue);
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            background: none;
            border: none;
            cursor: pointer;
            flex-shrink: 0;
        }

        .ios-back-btn:hover {
            opacity: 0.8;
        }

        .chat-target-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            text-decoration: none;
            color: inherit;
        }

        .chat-avatar-wrap {
            position: relative;
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            border-radius: 50%;
            overflow: hidden;
            background: var(--tk-blue-soft);
            border: 2px solid var(--tk-border-blue);
        }

        .chat-avatar-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 50% 20%;
            display: block;
        }

        .chat-meta {
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .chat-meta-name-row {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .chat-name {
            font-size: 15.5px;
            font-weight: 750;
            color: var(--tk-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.25;
        }

        .verified-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .chat-substatus {
            font-size: 11.5px;
            color: var(--tk-text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 2px;
        }

        .chat-header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .private-chat-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 9px;
            border-radius: 8px;
            background: var(--tk-blue-soft);
            border: 1px solid var(--tk-border-blue);
            color: var(--tk-blue-dark);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .chat-viewport {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background: radial-gradient(circle at top right, rgba(219, 234, 254, 0.45) 0%, transparent 60%), #F8FAFC;
            padding: 16px 14px;
            position: relative;
        }

        .chat-loading-state {
            margin: auto;
            text-align: center;
            padding: 30px 16px;
            color: var(--tk-text-muted);
        }

        .chat-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--tk-border);
            border-top-color: var(--tk-blue);
            border-radius: 50%;
            margin: 0 auto 14px;
            animation: spin 0.8s linear infinite;
        }

        .chat-loading-state p {
            font-size: 13.5px;
            font-weight: 600;
        }

        .chat-locked-card {
            margin: auto;
            max-width: 380px;
            width: 100%;
            background: #FFFFFF;
            border: 1px solid var(--tk-border);
            border-radius: 22px;
            padding: 30px 22px;
            text-align: center;
            box-shadow: 0 12px 36px rgba(15, 23, 42, 0.06);
            animation: fadeIn 0.25s ease-out;
        }

        .locked-icon-wrap {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: var(--tk-blue-soft);
            color: var(--tk-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            border: 1px solid var(--tk-border-blue);
        }

        .locked-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 8px;
            background: #EFF6FF;
            color: #1D4ED8;
            font-size: 11px;
            font-weight: 750;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .locked-title {
            font-size: 19px;
            font-weight: 800;
            color: var(--tk-text);
            margin-bottom: 8px;
        }

        .locked-desc {
            font-size: 13.5px;
            color: var(--tk-text-muted);
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .locked-action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 13px 18px;
            border-radius: 14px;
            border: none;
            background: var(--tk-blue);
            color: #FFFFFF;
            font-size: 14.5px;
            font-weight: 750;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.28);
            transition: background 0.15s ease, transform 0.15s ease;
        }

        .locked-action-btn:hover {
            background: var(--tk-blue-dark);
        }

        .locked-action-btn:active {
            transform: scale(0.985);
        }

        .chat-empty-state {
            margin: auto;
            max-width: 340px;
            width: 100%;
            text-align: center;
            padding: 24px 16px;
            color: var(--tk-text-muted);
            animation: fadeIn 0.25s ease-out;
        }

        .empty-chat-circle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--tk-blue-soft);
            color: var(--tk-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            border: 1px solid var(--tk-border-blue);
        }

        .chat-empty-state h3 {
            font-size: 17px;
            font-weight: 800;
            color: var(--tk-text);
            margin-bottom: 6px;
        }

        .chat-empty-state p {
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        .quick-replies-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .quick-chip {
            padding: 7px 13px;
            border-radius: 12px;
            background: #FFFFFF;
            border: 1px solid var(--tk-border);
            font-size: 12.5px;
            font-weight: 600;
            color: var(--tk-text);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .quick-chip:hover {
            border-color: var(--tk-blue);
            color: var(--tk-blue);
            background: var(--tk-blue-soft);
        }

        .messages-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            padding-bottom: 8px;
        }

        .chat-system-date {
            align-self: center;
            padding: 4px 12px;
            border-radius: 10px;
            background: #FFFFFF;
            border: 1px solid var(--tk-border);
            color: var(--tk-text-muted);
            font-size: 11px;
            font-weight: 600;
            margin: 6px 0 12px;
        }

        .chat-bubble {
            max-width: 80%;
            align-self: flex-end;
            margin-left: 20%;
            padding: 10px 14px 6px 14px;
            border-radius: 18px 18px 4px 18px;
            background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
            color: #FFFFFF;
            box-shadow: 0 3px 10px rgba(37, 99, 235, 0.22);
            word-break: break-word;
            animation: bubbleIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .bubble-text {
            font-size: 14.5px;
            line-height: 1.45;
            white-space: pre-wrap;
        }

        .bubble-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            margin-top: 3px;
        }

        .bubble-time {
            font-size: 10.5px;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
        }

        .bubble-ticks {
            display: inline-flex;
            color: rgba(255, 255, 255, 0.95);
        }

        .chat-composer-bar {
            position: sticky;
            bottom: 0;
            z-index: 40;
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 10px 14px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--tk-border);
        }

        .chat-input-wrap {
            flex: 1;
            display: flex;
            align-items: center;
        }

        .chat-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 22px;
            border: 1px solid var(--tk-border);
            background: var(--tk-bg);
            color: var(--tk-text);
            font-size: 14.5px;
            outline: none;
            transition: all 0.15s ease;
        }

        .chat-input:focus {
            background: #FFFFFF;
            border-color: var(--tk-blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .chat-send-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--tk-blue);
            color: #FFFFFF;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transition: background 0.15s ease, transform 0.15s ease;
        }

        .chat-send-btn:hover:not(:disabled) {
            background: var(--tk-blue-dark);
        }

        .chat-send-btn:active:not(:disabled) {
            transform: scale(0.92);
        }

        .chat-send-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            box-shadow: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bubbleIn {
            from { opacity: 0; transform: translateY(8px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
    <script src="tracking.js" defer></script>
</head>

<body>

    <div class="chat-app-shell">
        <header class="chat-header">
            <div class="chat-header-left">
                <a href="creator_home.html#chats" id="backBtn" class="ios-back-btn" aria-label="Back">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                    <span>Back</span>
                </a>

                <div class="chat-target-profile">
                    <div class="chat-avatar-wrap">
                        <img id="creatorAvatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=80" alt="Creator photo">
                    </div>

                    <div class="chat-meta">
                        <div class="chat-meta-name-row">
                            <span id="creatorName" class="chat-name">Connecting...</span>
                            <span class="verified-badge" title="Verified Profile">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                    <circle cx="12" cy="12" r="10" fill="#2563EB"></circle>
                                    <path d="M8 12l3 3 5-5" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
                                </svg>
                            </span>
                        </div>
                        <span id="chatSubstatus" class="chat-substatus">
                            <span>Verifying membership...</span>
                        </span>
                    </div>
                </div>
            </div>

            <div class="chat-header-right">
                <span class="private-chat-tag">1:1 Chat</span>
            </div>
        </header>

        <main id="chatViewport" class="chat-viewport" aria-label="Messages list" aria-live="polite">
            <div id="loadingState" class="chat-loading-state">
                <div class="chat-spinner"></div>
                <p>Checking your membership access...</p>
            </div>

            <div id="lockedState" class="chat-locked-card" style="display: none;">
                <div class="locked-icon-wrap" aria-hidden="true">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
                <span id="lockedBadge" class="locked-badge">Membership Required</span>
                <h2 id="lockedTitle" class="locked-title">Monthly Membership Required</h2>
                <p id="lockedDesc" class="locked-desc">1-on-1 chat across Takora is unlocked with Basic (₹9/mo), Pro (₹29/mo), or Premium (₹99/mo).</p>
                <div id="lockedActionWrap">
                    <a href="pricing.html?plan=basic" class="locked-action-btn">View Monthly Plans (from ₹9/mo)</a>
                </div>
            </div>

            <div id="messagesList" class="messages-list" style="display: none;"></div>
        </main>

        <form id="chatForm" class="chat-composer-bar" style="display: none;">
            <div class="chat-input-wrap">
                <input
                    type="text"
                    id="chatInput"
                    class="chat-input"
                    placeholder="Write your message..."
                    autocomplete="off"
                    maxlength="2000"
                    aria-label="Write a message"
                >
            </div>
            <button type="submit" id="sendBtn" class="chat-send-btn" aria-label="Send message" disabled>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </form>
    </div>

    <script src="takora_auth.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const creatorId = urlParams.get("id");

        const loadingState = document.getElementById("loadingState");
        const lockedState = document.getElementById("lockedState");
        const lockedBadge = document.getElementById("lockedBadge");
        const lockedTitle = document.getElementById("lockedTitle");
        const lockedDesc = document.getElementById("lockedDesc");
        const lockedActionWrap = document.getElementById("lockedActionWrap");
        const messagesList = document.getElementById("messagesList");
        const chatViewport = document.getElementById("chatViewport");
        const chatForm = document.getElementById("chatForm");
        const chatInput = document.getElementById("chatInput");
        const sendBtn = document.getElementById("sendBtn");
        const creatorAvatar = document.getElementById("creatorAvatar");
        const creatorName = document.getElementById("creatorName");
        const chatSubstatus = document.getElementById("chatSubstatus");
        const backBtn = document.getElementById("backBtn");

        let activeCreator = null;
        let isSending = false;

        function escapeHTML(str) {
            if (!str) return "";
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function formatTime(isoString) {
            try {
                const date = isoString ? new Date(isoString) : new Date();
                return date.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
            } catch (_) {
                return "Just now";
            }
        }

        function showLockedState({ badge, title, message, buttonHtml, backUrl }) {
            loadingState.style.display = "none";
            messagesList.style.display = "none";
            chatForm.style.display = "none";

            lockedBadge.textContent = badge || "Access Locked";
            lockedTitle.textContent = title;
            lockedDesc.textContent = message;
            lockedActionWrap.innerHTML = buttonHtml;
            lockedState.style.display = "block";

            creatorName.textContent = "Private Chat";
            chatSubstatus.innerHTML = `<span>Membership verification required</span>`;
            if (backUrl) backBtn.href = backUrl;
        }

        async function initChat() {
            if (!creatorId) {
                showLockedState({
                    badge: "No Profile Selected",
                    title: "Select a Creator First",
                    message: "Please choose a creator profile from Takora Home or Explore to start chatting.",
                    buttonHtml: `<a href="creator_home.html" class="locked-action-btn">Browse Creators</a>`,
                    backUrl: "creator_home.html"
                });
                return;
            }

            if (window.TakoraAuth) {
                await window.TakoraAuth.refreshSession();
            }

            const profileUrl = `friend_profile.html?id=${encodeURIComponent(creatorId)}`;

            try {
                const apiFetcher = window.TakoraAuth
                    ? window.TakoraAuth.apiFetch
                    : async (url, opt) => {
                        const base = /\.(vercel\.app|netlify\.app|pages\.dev|github\.io)$/i.test(window.location.hostname)
                            ? "https://creatorpay-backend.onrender.com"
                            : "";
                        const r = await fetch(`${base}${url}`, { ...opt, credentials: "include" });
                        return { res: r, data: await r.json().catch(() => ({})) };
                    };

                const { res, data } = await apiFetcher("/api/chat/verify-access", {
                    method: "POST",
                    body: JSON.stringify({ creatorId })
                });

                if (res.status === 401) {
                    showLockedState({
                        badge: "Sign In Required",
                        title: "Sign In to Access Chat",
                        message: "Sign in to your Takora account (or create a free account and choose a monthly plan) to start 1-on-1 chat.",
                        buttonHtml: `
                            <button type="button" id="chatSignInBtn" class="locked-action-btn">Sign In / Create Free Account</button>
                            <a href="pricing.html?plan=basic" style="display:block; margin-top:10px; font-size:13px; font-weight:700; color:#2563EB;">View Monthly Plans (from ₹9/mo)</a>
                        `,
                        backUrl: profileUrl
                    });
                    const signInBtn = document.getElementById("chatSignInBtn");
                    if (signInBtn && window.TakoraAuth) {
                        signInBtn.onclick = () => window.TakoraAuth.openAuthModal("login", () => initChat());
                    }
                    return;
                }

                if (res.status === 403 || !res.ok || !data.success || !data.authorized) {
                    showLockedState({
                        badge: "Membership Required",
                        title: "Monthly Membership Needed",
                        message: (data && data.message && res.status === 403)
                            ? data.message
                            : "Chat access requires an active Basic (₹9/mo), Pro (₹29/mo), or Premium (₹99/mo) plan.",
                        buttonHtml: `<a href="pricing.html?plan=basic" class="locked-action-btn">View Monthly Plans (from ₹9/mo)</a>`,
                        backUrl: profileUrl
                    });
                    return;
                }

                activeCreator = data.creator;
                setupVerifiedUI(data.creator, data.entitlements);
                await loadMessages();
            } catch (err) {
                console.error("Chat verification network error:", err);
                showLockedState({
                    badge: "Connection Issue",
                    title: "Unable to Verify Access",
                    message: "Please check your connection and try again.",
                    buttonHtml: `<button type="button" id="chatRetryBtn" class="locked-action-btn">Retry</button>`,
                    backUrl: profileUrl
                });
                const retryBtn = document.getElementById("chatRetryBtn");
                if (retryBtn) retryBtn.onclick = () => initChat();
            }
        }

        function setupVerifiedUI(creator, entitlements) {
            loadingState.style.display = "none";
            lockedState.style.display = "none";
            messagesList.style.display = "flex";
            chatForm.style.display = "flex";

            const name = creator.name || "Creator";
            const avatar = (creator.profile_image && typeof creator.profile_image === "string" && creator.profile_image.startsWith("http"))
                ? creator.profile_image
                : "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=80";

            creatorName.textContent = name;
            creatorAvatar.src = avatar;
            creatorAvatar.alt = name;

            const planLabel = entitlements && entitlements.planName ? `${entitlements.planName} Plan` : "Membership Active";
            const metaInfo = [
                creator.creator_age || creator.age ? `${creator.creator_age || creator.age} yrs` : "",
                creator.creator_location || creator.location || ""
            ].filter(Boolean).join(" · ");

            chatSubstatus.innerHTML = `
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                <span>${escapeHTML(planLabel)}${metaInfo ? ` · ${escapeHTML(metaInfo)}` : ""}</span>
            `;

            document.title = `Chat with ${name} | Takora`;
            backBtn.href = `friend_profile.html?id=${encodeURIComponent(creator.id || creatorId)}`;
            chatInput.placeholder = `Write a message to ${name}...`;
            chatInput.focus();

            try {
                const raw = localStorage.getItem("fc_connections");
                const list = raw ? JSON.parse(raw) : [];
                const safeList = Array.isArray(list) ? list : [];
                const cid = String(creator.id || creatorId);
                const updated = [
                    { id: cid, name, profile_image: avatar },
                    ...safeList.filter((item) => item && String(item.id) !== cid)
                ].slice(0, 30);
                localStorage.setItem("fc_connections", JSON.stringify(updated));
            } catch (_) {}
        }

        async function loadMessages() {
            try {
                const apiFetcher = window.TakoraAuth
                    ? window.TakoraAuth.apiFetch
                    : async (url, opt) => {
                        const r = await fetch(url, { ...opt, credentials: "include" });
                        return { res: r, data: await r.json().catch(() => ({})) };
                    };

                const { res, data } = await apiFetcher("/api/chat/messages", {
                    method: "POST",
                    body: JSON.stringify({ creatorId })
                });

                if (res.ok && data.success && Array.isArray(data.messages)) {
                    renderMessages(data.messages);
                } else {
                    renderMessages([]);
                }
            } catch (err) {
                console.warn("Unable to load chat messages:", err);
                renderMessages([]);
            }
        }

        function renderMessages(messages) {
            messagesList.innerHTML = "";

            if (!messages || messages.length === 0) {
                const partnerName = (activeCreator && activeCreator.name) || "your creator";
                messagesList.innerHTML = `
                    <div class="chat-empty-state">
                        <div class="empty-chat-circle" aria-hidden="true">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                            </svg>
                        </div>
                        <h3>Say Hello to ${escapeHTML(partnerName)}</h3>
                        <p>Your membership is active! Start a friendly 1-on-1 conversation.</p>
                        <div class="quick-replies-row">
                            <button type="button" class="quick-chip" onclick="applyQuickText('Hi there! Excited to connect with you.')">Hi there!</button>
                            <button type="button" class="quick-chip" onclick="applyQuickText('Loved your profile! How has your day been?')">How is your day?</button>
                            <button type="button" class="quick-chip" onclick="applyQuickText('Hello! Would love to chat about your interests.')">Let\\'s chat</button>
                        </div>
                    </div>
                `;
                return;
            }

            const dateBadge = document.createElement("div");
            dateBadge.className = "chat-system-date";
            dateBadge.textContent = "Membership Conversation";
            messagesList.appendChild(dateBadge);

            messages.forEach((msg) => {
                appendBubble(msg.text, msg.timestamp, false);
            });

            scrollToBottom();
        }

        function appendBubble(text, timestamp, animate = true) {
            const empty = messagesList.querySelector(".chat-empty-state");
            if (empty) empty.remove();

            const bubble = document.createElement("div");
            bubble.className = "chat-bubble";
            if (!animate) {
                bubble.style.animation = "none";
            }

            bubble.innerHTML = `
                <div class="bubble-text">${escapeHTML(text)}</div>
                <div class="bubble-footer">
                    <span class="bubble-time">${formatTime(timestamp)}</span>
                    <span class="bubble-ticks" aria-label="Sent">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </span>
                </div>
            `;

            messagesList.appendChild(bubble);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatViewport.scrollTo({
                top: chatViewport.scrollHeight,
                behavior: "smooth"
            });
        }

        window.applyQuickText = function (text) {
            chatInput.value = text;
            chatInput.focus();
            sendBtn.disabled = false;
        };

        chatInput.addEventListener("input", () => {
            sendBtn.disabled = chatInput.value.trim().length === 0 || isSending;
        });

        chatForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const messageText = chatInput.value.trim();
            if (!messageText || isSending) return;

            isSending = true;
            sendBtn.disabled = true;
            chatInput.value = "";

            appendBubble(messageText, new Date().toISOString(), true);

            try {
                if (window.MYP_TRACK) {
                    window.MYP_TRACK.trackEvent("message_sent", {
                        creatorId,
                        creatorName: activeCreator ? activeCreator.name : null
                    });
                }
            } catch (_) {}

            try {
                const apiFetcher = window.TakoraAuth
                    ? window.TakoraAuth.apiFetch
                    : async (url, opt) => {
                        const r = await fetch(url, { ...opt, credentials: "include" });
                        return { res: r, data: await r.json().catch(() => ({})) };
                    };

                const { res, data } = await apiFetcher("/api/chat/send", {
                    method: "POST",
                    body: JSON.stringify({ creatorId, messageText })
                });

                if (!res.ok || !data.success) {
                    if (window.TakoraAuth) {
                        window.TakoraAuth.showToast(data.message || "Unable to send message", true);
                    }
                }
            } catch (err) {
                console.error("Failed to send message:", err);
            } finally {
                isSending = false;
                sendBtn.disabled = chatInput.value.trim().length === 0;
                chatInput.focus();
            }
        });

        initChat();
    </script>

</body>

</html>
