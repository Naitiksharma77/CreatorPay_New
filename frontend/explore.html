    <!-- =========================================================
         UI FILTER ONLY
         
         This does NOT call the API.
         This does NOT touch Razorpay.
         This does NOT touch Render.
         This does NOT touch Supabase.
         
         It only filters already-rendered cards in the browser.
    ========================================================== -->

    <script>

        (function () {


            const searchInput =
                document.getElementById(
                    "creatorSearch"
                );


            const filterContainer =
                document.getElementById(
                    "categoryFilters"
                );


            const creatorList =
                document.getElementById(
                    "creatorList"
                );


            if (
                !searchInput ||
                !filterContainer ||
                !creatorList
            ) {

                return;

            }



            let activeCategory =
                "all";



            function normalize(value) {

                return String(
                    value || ""
                )
                    .toLowerCase()
                    .trim();

            }



            function getCards() {

                return Array.from(
                    creatorList.children
                )
                    .filter(function (element) {

                        return (
                            element.classList.contains(
                                "creator-card"
                            ) ||
                            element.classList.contains(
                                "fc-person-card"
                            )
                        );

                    });

            }



            function applyFilters() {


                const query =
                    normalize(
                        searchInput.value
                    );


                const cards =
                    getCards();


                cards.forEach(
                    function (card) {


                        const text =
                            normalize(
                                card.innerText
                            );


                        const matchesSearch =
                            !query ||
                            text.includes(
                                query
                            );


                        let matchesCategory =
                            true;


                        if (
                            activeCategory !==
                            "all"
                        ) {


                            const categoryText =
                                normalize(
                                    (
                                        card.querySelector(
                                            ".creator-category"
                                        ) ||
                                        card.querySelector(
                                            ".fc-person-category"
                                        ) ||
                                        card
                                    ).innerText
                                );


                            const buttonText =
                                normalize(
                                    activeCategory
                                );


                            matchesCategory =
                                categoryText.includes(
                                    buttonText
                                ) ||
                                text.includes(
                                    buttonText
                                );


                            if (
                                activeCategory ===
                                "lifestyle"
                            ) {

                                matchesCategory =
                                    text.includes(
                                        "lifestyle"
                                    ) ||
                                    text.includes(
                                        "content"
                                    );

                            }


                            if (
                                activeCategory ===
                                "design"
                            ) {

                                matchesCategory =
                                    text.includes(
                                        "design"
                                    ) ||
                                    text.includes(
                                        "creative"
                                    ) ||
                                    text.includes(
                                        "arts"
                                    );

                            }


                            if (
                                activeCategory ===
                                "conversation"
                            ) {

                                matchesCategory =
                                    text.includes(
                                        "conversation"
                                    ) ||
                                    text.includes(
                                        "lifestyle"
                                    );

                            }

                        }


                        card.style.display =
                            (
                                matchesSearch &&
                                matchesCategory
                            )
                                ? ""
                                : "none";

                    }
                );

            }



            searchInput.addEventListener(
                "input",
                applyFilters
            );



            filterContainer
                .addEventListener(
                    "click",
                    function (event) {


                        const button =
                            event.target.closest(
                                ".fc-category-chip"
                            );


                        if (!button) {

                            return;

                        }


                        document
                            .querySelectorAll(
                                ".fc-category-chip"
                            )
                            .forEach(
                                function (item) {

                                    item.classList.remove(
                                        "active"
                                    );

                                }
                            );


                        button.classList.add(
                            "active"
                        );


                        activeCategory =
                            button.dataset.category ||
                            "all";


                        applyFilters();

                    }
                );



            /*
             * The existing explore_app.js can render
             * asynchronously.
             *
             * Observe the existing creatorList only
             * so filters are applied after cards arrive.
             */

            const observer =
                new MutationObserver(
                    function () {

                        applyFilters();

                    }
                );


            observer.observe(
                creatorList,
                {
                    childList: true,
                    subtree: true
                }
            );


        })();

    </script>
