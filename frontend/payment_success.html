<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Successful | Roséia</title>

    <link rel="stylesheet" href="payment_success_styles.css">
    
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-3ZVP8Q457D"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-3ZVP8Q457D');
</script>

    <script src="tracking.js" defer></script>
</head>

<body>

    <main class="success-container">

        <div class="success-card">

            <div class="success-icon">
                ✓
            </div>

            <p class="eyebrow">
                PAYMENT SUCCESSFUL
            </p>

            <h1>
                Thank you!
            </h1>

            <p class="success-message">
                Your payment has been completed successfully.
            </p>

            <div class="success-note">

                <p>
                    You selected:
                    <strong id="creatorName">
                        Friend
                    </strong>
                </p>

                <p>
                    Amount:
                    <strong id="paymentAmount">
                        ₹0
                    </strong>
                </p>

            </div>

            <div id="chatActionWrap" style="display: none; margin-top: 26px;">
                <a id="startChatBtn" href="chat.html" class="home-button" style="background: linear-gradient(135deg, #EC4899 0%, #DB2777 100%); box-shadow: 0 4px 16px rgba(236,72,153,0.35); margin-top: 0; margin-bottom: 12px; display: block;">
                    Start Chat with <span id="chatCreatorBtnName">Partner</span>
                </a>
            </div>

            <a
                href="explore.html"
                class="home-button"
            >
                Back to Explore
            </a>

            <a
                href="creator_home.html"
                class="secondary-link"
            >
                Go to Home
            </a>

        </div>

    </main>

    <script>

        const savedPayment =
            localStorage.getItem("creatorpay_payment");
        let targetCreatorId = null;

        if (savedPayment) {
            try {
                const paymentDetails =
                    JSON.parse(savedPayment);

                if (paymentDetails.creatorName) {
                    document.getElementById(
                        "creatorName"
                    ).textContent =
                        paymentDetails.creatorName;
                }

                if (paymentDetails.amount) {
                    document.getElementById(
                        "paymentAmount"
                    ).textContent =
                        "₹" +
                        Number(
                            paymentDetails.amount
                        ).toLocaleString("en-IN");
                }

                if (paymentDetails.creatorId) {
                    targetCreatorId = paymentDetails.creatorId;
                }
            } catch (_) {}
        }

        const params = new URLSearchParams(window.location.search);
        if (params.get("id")) targetCreatorId = params.get("id");

        if (targetCreatorId) {
            try {
                const sessRaw = localStorage.getItem(`fc_chat_session_${targetCreatorId}`);
                if (sessRaw) {
                    const sess = JSON.parse(sessRaw);
                    if (sess && sess.token && sess.paymentId) {
                        const chatWrap = document.getElementById("chatActionWrap");
                        const chatBtn = document.getElementById("startChatBtn");
                        const chatName = document.getElementById("chatCreatorBtnName");
                        chatBtn.href = `chat.html?id=${encodeURIComponent(targetCreatorId)}&payment_id=${encodeURIComponent(sess.paymentId)}&token=${encodeURIComponent(sess.token)}`;
                        if (sess.creatorName) chatName.textContent = sess.creatorName;
                        chatWrap.style.display = "block";
                    }
                }
            } catch (_) {}
        }

    </script>

</body>
</html>
