<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membership Confirmation | Takora</title>

    <link rel="stylesheet" href="payment_success_styles.css">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3ZVP8Q457D"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-3ZVP8Q457D');
    </script>

    <script src="tracking.js" defer></script>
</head>

<body>

    <main class="success-container">
        <div class="success-card">
            <div id="statusIcon" class="success-icon">✓</div>
            <p id="statusEyebrow" class="eyebrow">CHECKING MEMBERSHIP</p>
            <h1 id="statusHeading">Verifying your plan...</h1>
            <p id="statusMessage" class="success-message">Confirming your monthly Takora membership status with the server.</p>

            <div id="detailsCard" class="success-note" style="display: none;">
                <div class="detail-row">
                    <span class="detail-label">Membership Plan</span>
                    <span id="planNameVal" class="detail-val blue">—</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Monthly Billing</span>
                    <span id="planAmountVal" class="detail-val">—</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">AutoPay Status</span>
                    <span id="autoPayStatusVal" class="detail-val green">—</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Next Renewal Date</span>
                    <span id="nextBillingVal" class="detail-val">—</span>
                </div>
                <div class="perm-grid" id="permGrid">
                    <div id="permChat" class="perm-chip">Chat</div>
                    <div id="permVoice" class="perm-chip">Voice Call</div>
                    <div id="permVideo" class="perm-chip">HD Video Call</div>
                </div>
            </div>

            <a href="creator_home.html" class="home-button">Explore Creators</a>
            <button type="button" id="manageBtn" class="secondary-button">Manage Membership &amp; AutoPay</button>
            <a href="pricing.html" class="secondary-link">View All Monthly Plans</a>
        </div>
    </main>

    <script src="takora_auth.js"></script>
    <script>
        (function () {
            const statusIcon = document.getElementById("statusIcon");
            const statusEyebrow = document.getElementById("statusEyebrow");
            const statusHeading = document.getElementById("statusHeading");
            const statusMessage = document.getElementById("statusMessage");
            const detailsCard = document.getElementById("detailsCard");
            const manageBtn = document.getElementById("manageBtn");

            function formatDate(iso) {
                if (!iso) return "—";
                try {
                    return new Date(iso).toLocaleDateString("en-IN", {
                        day: "numeric",
                        month: "short",
                        year: "numeric"
                    });
                } catch (_) {
                    return "—";
                }
            }

            async function loadConfirmation() {
                if (!window.TakoraAuth) return;
                await window.TakoraAuth.refreshSession();
                const auth = window.TakoraAuth.getState();

                if (!auth.authenticated) {
                    statusIcon.className = "success-icon pending";
                    statusIcon.textContent = "!";
                    statusEyebrow.textContent = "NO ACTIVE SESSION";
                    statusHeading.textContent = "Check Your Membership";
                    statusMessage.textContent = "No active subscription session was found in this browser. Choose a monthly plan below or sign in if you subscribed from another device.";
                    manageBtn.textContent = "Choose a Monthly Plan";
                    manageBtn.onclick = () => { window.location.href = "pricing.html"; };
                    return;
                }

                const { res, data } = await window.TakoraAuth.apiFetch("/api/subscriptions/me", { method: "GET" });
                const sub = res.ok && data ? data.subscription : auth.subscription;
                const ent = res.ok && data ? data.entitlements : auth.entitlements;

                if (ent && ent.hasActiveSubscription && sub) {
                    statusIcon.className = "success-icon";
                    statusIcon.textContent = "✓";
                    statusEyebrow.textContent = "MEMBERSHIP ACTIVE";
                    statusHeading.textContent = `Welcome to ${ent.planName}!`;
                    statusMessage.textContent = "Your monthly Razorpay AutoPay subscription is verified. Your unlocked creator features are ready right away.";

                    detailsCard.style.display = "block";
                    document.getElementById("planNameVal").textContent = `${ent.planName} Plan`;
                    document.getElementById("planAmountVal").textContent = `₹${ent.amountInr}/month`;
                    document.getElementById("autoPayStatusVal").textContent = ent.cancelAtPeriodEnd
                        ? "Cancels at Cycle End"
                        : "Active · AutoPay On";
                    document.getElementById("nextBillingVal").textContent = ent.cancelAtPeriodEnd
                        ? `Ends ${formatDate(ent.currentEnd)}`
                        : formatDate(ent.nextBillingDate || ent.currentEnd);

                    const chatEl = document.getElementById("permChat");
                    const voiceEl = document.getElementById("permVoice");
                    const videoEl = document.getElementById("permVideo");
                    chatEl.textContent = ent.canChat ? "✓ 1:1 Chat" : "✕ 1:1 Chat";
                    chatEl.className = `perm-chip ${ent.canChat ? "unlocked" : ""}`;
                    voiceEl.textContent = ent.canVoiceCall ? "✓ Voice Call" : "✕ Voice Call";
                    voiceEl.className = `perm-chip ${ent.canVoiceCall ? "unlocked" : ""}`;
                    videoEl.textContent = ent.canVideoCall ? "✓ HD Video Call" : "✕ HD Video Call";
                    videoEl.className = `perm-chip ${ent.canVideoCall ? "unlocked" : ""}`;

                    manageBtn.onclick = () => window.TakoraAuth.openAccountModal();
                    return;
                }

                if (ent && ent.pendingMandate) {
                    statusIcon.className = "success-icon pending";
                    statusIcon.textContent = "⏳";
                    statusEyebrow.textContent = "PENDING SETTLEMENT";
                    statusHeading.textContent = "Mandate Authorized";
                    statusMessage.textContent = "Your AutoPay mandate is authorized and awaiting final payment confirmation from Razorpay. Access unlocks automatically once payment settles.";
                    manageBtn.onclick = () => loadConfirmation();
                    manageBtn.textContent = "Refresh Membership Status";
                    return;
                }

                statusIcon.className = "success-icon pending";
                statusIcon.textContent = "!";
                statusEyebrow.textContent = "NO ACTIVE SUBSCRIPTION";
                statusHeading.textContent = "Plan Not Yet Active";
                statusMessage.textContent = "No verified monthly payment was found for this account yet. Choose a plan to activate membership access.";
                manageBtn.textContent = "Choose a Monthly Plan";
                manageBtn.onclick = () => { window.location.href = "pricing.html"; };
            }

            document.addEventListener("DOMContentLoaded", loadConfirmation);
        })();
    </script>

</body>
</html>
