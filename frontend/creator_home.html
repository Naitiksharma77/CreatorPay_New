<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FFF7FA">
    <meta name="description" content="Discover compatible people, explore profiles, and book personal dates on Roséia.">
    <title>Roséia — Curated In-Person Dating</title>

    <!-- Google Fonts for Editorial Roséia Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="ios_app.css">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3ZVP8Q457D"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-3ZVP8Q457D');
    </script>
    <script src="tracking.js" defer></script>
</head>

<body>

    <div class="app-shell">

        <!-- =========================================================
             ROSÉIA HEADER WITH DESKTOP NAVIGATION
        ========================================================= -->
        <header class="app-header">
            <div class="header-inner">
                <a href="#explore" class="app-brand" onclick="switchTab('explore')" aria-label="Roséia">
                    <span class="brand-name">Roséia</span>
                </a>

                <nav class="desktop-nav" aria-label="Main Navigation">
                    <button type="button" class="desktop-nav-link active" data-tab="explore" onclick="switchTab('explore')">Explore</button>
                    <button type="button" class="desktop-nav-link" data-tab="search" onclick="switchTab('search')">Search</button>
                    <button type="button" class="desktop-nav-link" data-tab="favorites" onclick="switchTab('favorites')">Favorites</button>
                    <button type="button" class="desktop-nav-link" data-tab="bookings" onclick="switchTab('bookings')">Bookings</button>
                </nav>

                <button type="button" class="header-avatar-btn" onclick="toggleProfileSheet()" aria-label="My Account" title="My Profile &amp; Settings">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </button>
            </div>
        </header>


        <!-- =========================================================
             APP VIEWPORT (PRIMARY TABS)
        ========================================================= -->
        <main class="app-viewport">

            <!-- TAB 1: EXPLORE (HOME FEED) -->
            <section id="tab-home" class="tab-view active" aria-label="Explore Feed">
                <div id="homePeopleList" class="people-feed">
                    <div class="loading-state">
                        <span class="loading-spinner"></span>
                        <p>Loading curated profiles...</p>
                    </div>
                </div>
            </section>


            <!-- TAB 2: SEARCH (DISCOVER) -->
            <section id="tab-discover" class="tab-view" aria-label="Search People">
                <div class="app-greeting">
                    <h1 class="greeting-title">Search</h1>
                    <p class="greeting-subtitle">Find someone special you'll love talking to.</p>
                </div>

                <!-- Instant Search -->
                <div class="search-bar-wrap">
                    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#817783" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="7.5"></circle>
                        <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
                    </svg>
                    <input type="text" id="discoverSearchInput" class="search-input" placeholder="Search by name, interests or topic..." autocomplete="off">
                    <button id="clearSearchBtn" class="clear-search-btn" style="display:none;" aria-label="Clear search">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>

                <!-- Interest Filter Chips -->
                <div id="filterChips" class="filter-chips-row">
                    <button type="button" class="filter-chip active" data-category="all">✨ All</button>
                    <button type="button" class="filter-chip" data-category="content">🌸 Lifestyle &amp; Culture</button>
                    <button type="button" class="filter-chip" data-category="design">🎨 Creative &amp; Design</button>
                    <button type="button" class="filter-chip" data-category="tech">💻 Tech &amp; Ambition</button>
                    <button type="button" class="filter-chip" data-category="conversation">💬 Deep Conversations</button>
                </div>

                <div id="discoverPeopleList" class="people-feed">
                    <div class="loading-state">
                        <span class="loading-spinner"></span>
                        <p>Searching lovely people...</p>
                    </div>
                </div>
            </section>


            <!-- TAB 3: BOOKINGS (CHATS) -->
            <section id="tab-chats" class="tab-view" aria-label="My Bookings">
                <div class="app-greeting">
                    <h1 class="greeting-title">Bookings &amp; Connections</h1>
                    <p class="greeting-subtitle">Your confirmed dates and private conversations.</p>
                </div>

                <div id="chatsContent">
                    <!-- Populated dynamically -->
                </div>
            </section>

        </main>


        <!-- =========================================================
             FIXED 5-ITEM BOTTOM NAVIGATION BAR (ROSÉIA)
        ========================================================= -->
        <nav class="bottom-tab-bar" aria-label="Main App Navigation">
            <button type="button" class="tab-btn active" data-tab="explore" onclick="switchTab('explore')" aria-label="Explore Tab">
                <span class="tab-icon-wrap">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
                    </svg>
                </span>
                <span>Explore</span>
            </button>

            <button type="button" class="tab-btn" data-tab="search" onclick="switchTab('search')" aria-label="Search Tab">
                <span class="tab-icon-wrap">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </span>
                <span>Search</span>
            </button>

            <button type="button" class="tab-btn" data-tab="favorites" onclick="switchTab('favorites')" aria-label="Favorites Tab">
                <span class="tab-icon-wrap">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                    </svg>
                </span>
                <span>Favorites</span>
            </button>

            <button type="button" class="tab-btn" data-tab="bookings" onclick="switchTab('bookings')" aria-label="Bookings Tab">
                <span class="tab-icon-wrap">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                </span>
                <span>Bookings</span>
            </button>

            <button type="button" class="tab-btn" data-tab="profile" onclick="toggleProfileSheet()" aria-label="Profile Tab">
                <span class="tab-icon-wrap">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </span>
                <span>Profile</span>
            </button>
        </nav>


        <!-- =========================================================
             PROFILE & ACCOUNT iOS BOTTOM SHEET MODAL
        ========================================================= -->
        <div id="profileSheetModal" class="profile-sheet-modal" aria-hidden="true">
            <div class="sheet-backdrop" onclick="toggleProfileSheet()"></div>
            <div class="sheet-card">
                <div class="sheet-grab-bar" aria-hidden="true"></div>

                <div class="sheet-top">
                    <h2 class="sheet-title">My Account</h2>
                    <button type="button" class="sheet-close-btn" onclick="toggleProfileSheet()" aria-label="Close">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>

                <div class="sheet-profile-header">
                    <div class="sheet-avatar">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </div>
                    <div class="sheet-user-info">
                        <h3>You</h3>
                        <p>Meet You Partner Member</p>
                    </div>
                </div>

                <div class="sheet-stats-grid">
                    <div class="sheet-stat-box" onclick="toggleProfileSheet(); switchTab('chats');">
                        <span id="sheetConnectionsCount" class="stat-num">0</span>
                        <span class="stat-lbl">My Connections</span>
                    </div>
                    <div class="sheet-stat-box" onclick="toggleProfileSheet(); switchTab('discover');">
                        <span id="sheetFavoritesCount" class="stat-num">0</span>
                        <span class="stat-lbl">Saved Profiles</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="ios_app.js"></script>

</body>

</html>
