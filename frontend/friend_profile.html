<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FFF7FA">
    <title>Profile | Roséia — Date Booking &amp; Connection</title>

    <link rel="stylesheet" href="friend_profile_styles.css">
    <link rel="stylesheet" href="roseia_booking_modal.css">

    <!-- Razorpay Checkout -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3ZVP8Q457D"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-3ZVP8Q457D');
    </script>
    <script src="tracking.js" defer></script>
</head>

<body>

    <div class="profile-app-shell">

        <!-- Top Navigation Header with iOS Back button -->
        <header class="profile-top-bar">
            <a href="creator_home.html" id="backBtn" class="ios-back-btn" aria-label="Back">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                <span>Back</span>
            </a>
            <span class="top-bar-title" style="font-weight: 700; color: #DB2777;">Roséia</span>
            <div class="top-bar-spacer"></div>
        </header>

        <main id="profileContent" class="profile-viewport">
            <div class="loading-state">
                <span class="loading-spinner"></span>
                <p>Loading Roséia profile...</p>
            </div>
        </main>

    </div>

    <!-- 4-STEP BOOKING WIZARD MODAL CONTAINER -->
    <div id="bookingWizardModal" class="wizard-backdrop" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="wizardStepTitle">
        <!-- Injected and managed by friend_profile_app.js -->
    </div>

    <!-- BOOKING SUCCESS CONFIRMATION MODAL -->
    <div id="bookingSuccessModal" class="wizard-backdrop" style="display: none;" role="dialog" aria-modal="true">
        <!-- Injected and managed by friend_profile_app.js -->
    </div>

    <!-- Roséia 4-step booking modal and Razorpay logic -->
    <script src="roseia_booking_modal.js"></script>
    <script src="friend_profile_app.js"></script>

</body>

</html>
